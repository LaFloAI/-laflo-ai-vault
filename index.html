<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaFlo-AI Vault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00FFFF;
            font-size: 1.5rem;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            resize: vertical;
        }
        button {
            background-color: #00FF00;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }
        button:hover {
            background-color: #00cc00;
        }
        .btn-copy {
            background-color: #00FFFF;
        }
        .btn-copy:hover {
            background-color: #00cccc;
        }
        .result {
            margin-top: 20px;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LaFlo-AI Vault</h1>
    <p style="font-size: 0.9rem; color: #aaa;">Sichere deine Ideen, Texte und Songs mit lokalem Hash & Zeitstempel.</p>
    
    <textarea id="userInput" placeholder="Gib hier deinen Text, Songtext oder deine Idee ein..."></textarea>
    
    <button onclick="generateVaultEntry()">Hash & Zeitstempel generieren</button>
    
    <div class="result" id="output" style="display:none;">
        <strong>Zeitstempel:</strong> <span id="timeOut"></span><br><br>
        <strong>SHA-256 Hash:</strong><br>
        <span id="hashOut" style="color: #00FFFF;"></span>
        
        <button class="btn-copy" onclick="copyHash()">Hash in Zwischenablage kopieren</button>
    </div>
</div>

<script>
let lastGeneratedHash = "";

async function generateVaultEntry() {
    const text = document.getElementById('userInput').value;
    if (!text.trim()) {
        alert('Bitte gib einen Text ein!');
        return;
    }

    const now = new Date().toISOString();
    const encoder = new TextEncoder();
    const data = encoder.encode(text + now);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    lastGeneratedHash = hashHex;

    document.getElementById('timeOut').innerText = now;
    document.getElementById('hashOut').innerText = hashHex;
    document.getElementById('output').style.display = 'block';
}

function copyHash() {
    if (!lastGeneratedHash) return;
    navigator.clipboard.writeText(lastGeneratedHash).then(() => {
        alert('Hash erfolgreich kopiert!');
    }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
    });
}
</script>

</body>
</html>
