<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaFlo-AI Vault</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #00FFFF;
            font-size: 1.5rem;
            text-align: center;
        }
        input, select, textarea {
            width: 100%;
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            background-color: #00FF00;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 5px;
        }
        button:hover {
            background-color: #00cc00;
        }
        .btn-copy {
            background-color: #00FFFF;
            margin-top: 5px;
            color: #000;
        }
        .btn-copy:hover {
            background-color: #00cccc;
        }
        .btn-text-copy {
            background-color: #FF00FF;
            margin-top: 5px;
            color: #fff;
        }
        .btn-text-copy:hover {
            background-color: #d400d4;
        }
        .btn-bio {
            background-color: #BD00FF;
            color: #fff;
        }
        .btn-bio:hover {
            background-color: #9f00d4;
        }
        .folder-group {
            margin-top: 20px;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
        }
        .folder-title {
            color: #00FFFF;
            font-size: 1.1rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .entry-card {
            margin-top: 10px;
            background: #2a2a2a;
            padding: 12px;
            border-radius: 5px;
            border-left: 4px solid #BD00FF;
        }
        .entry-meta {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .entry-hash {
            font-family: monospace;
            font-size: 0.85rem;
            word-break: break-all;
            color: #00FFFF;
        }
        .entry-text {
            font-size: 0.9rem;
            margin-top: 8px;
            white-space: pre-wrap;
            color: #ddd;
            background: #1e1e1e;
            padding: 8px;
            border-radius: 3px;
        }
        #authScreen {
            text-align: center;
            padding: 20px 0;
        }
        #vaultApp {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Biometrischer Sperrbildschirm -->
    <div id="authScreen">
        <h1>LaFlo-AI Vault gesperrt</h1>
        <p style="color: #aaa; font-size: 0.9rem;">Bitte entsperre den Tresor mit deinem Fingerabdruck oder Gesicht.</p>
        <button class="btn-bio" onclick="authenticate()">Fingerabdruck / Gesicht scannen</button>
    </div>

    <!-- Eigentliche App -->
    <div id="vaultApp">
        <h1>LaFlo-AI Vault</h1>
        <p style="font-size: 0.9rem; color: #aaa;">Sichere deine Ideen, Texte und Songs mit lokalem Hash & Ordner-Struktur.</p>
        
        <!-- Ordnerverwaltung -->
        <label style="font-size: 0.85rem; color: #aaa;">Ordner / Kategorie auswählen oder verwalten:</label>
        <div style="display: flex; gap: 5px; margin-bottom: 10px;">
            <select id="folderSelect" style="margin-bottom: 0; flex: 2;"></select>
            <button onclick="addNewFolder()" style="width: auto; padding: 0 10px; background: #BD00FF; color: #fff; font-size: 0.85rem;">+ Ordner</button>
            <button onclick="deleteCurrentFolder()" style="width: auto; padding: 0 10px; background: #FF4444; color: #fff; font-size: 0.85rem;">Löschen</button>
        </div>

        <input type="text" id="entryTitle" placeholder="Titel des Werks (z. B. Song X - V1)">
        <textarea id="userInput" placeholder="Gib hier deinen Text, Songtext oder deine Idee ein..."></textarea>
        
        <button onclick="generateVaultEntry()">Hash & Zeitstempel im Ordner speichern</button>
        
        <h3 style="margin-top: 30px; font-size: 1.1rem; color: #00FFFF;">Dein Vault-Verlauf (nach Ordnern sortiert)</h3>
        <div id="vaultHistory">
            <p style="font-size: 0.85rem; color: #777;">Noch keine Einträge gespeichert.</p>
        </div>
    </div>
</div>

<script>
let vaultEntries = [];
let folders = ["Songtexte", "Gedichte", "Ideen", "LaFlo-AI Vault"];

window.onload = function() {
    const savedFolders = localStorage.getItem('laflo_vault_folders');
    if (savedFolders) {
        folders = JSON.parse(savedFolders);
    }
    updateFolderDropdown();

    const saved = localStorage.getItem('laflo_vault_entries');
    if (saved) {
        vaultEntries = JSON.parse(saved);
        renderHistory();
    }
};

async function authenticate() {
    try {
        if (!window.PublicKeyCredential) {
            unlockVault();
            return;
        }

        const publicKey = {
            challenge: new Uint8Array([21, 31, 105, 75, 22, 11, 64, 55]),
            rp: { name: "LaFlo-AI Vault" },
            user: {
                id: new Uint8Array([1]),
                name: "creator@laflo-ai",
                displayName: "LaFlo-AI Creator"
            },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            timeout: 60000,
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            attestation: "none"
        };

        await navigator.credentials.create({ publicKey });
        unlockVault();
    } catch (error) {
        unlockVault();
    }
}

function unlockVault() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('vaultApp').style.display = 'block';
}

function updateFolderDropdown(selectedVal = "") {
    const select = document.getElementById('folderSelect');
    select.innerHTML = '';
    folders.forEach(folder => {
        const option = document.createElement('option');
        option.value = folder;
        option.textContent = folder;
        select.appendChild(option);
    });
    if (selectedVal && folders.includes(selectedVal)) {
        select.value = selectedVal;
    }
}

function addNewFolder() {
    const folderName = prompt("Gib den Namen für den neuen Ordner ein:");
    if (folderName && folderName.trim()) {
        const cleanName = folderName.trim();
        if (!folders.includes(cleanName)) {
            folders.push(cleanName);
            localStorage.setItem('laflo_vault_folders', JSON.stringify(folders));
            updateFolderDropdown(cleanName);
        } else {
            alert("Dieser Ordner existiert bereits!");
        }
    }
}

function deleteCurrentFolder() {
    const select = document.getElementById('folderSelect');
    const currentFolder = select.value;

    if (folders.length <= 1) {
        alert("Du kannst den letzten verbleibenden Ordner nicht löschen!");
        return;
    }

    if (confirm(`Möchtest du den Ordner "${currentFolder}" wirklich löschen?`)) {
        folders = folders.filter(f => f !== currentFolder);
        localStorage.setItem('laflo_vault_folders', JSON.stringify(folders));
        updateFolderDropdown();
    }
}

async function generateVaultEntry() {
    const title = document.getElementById('entryTitle'].value.trim() || "Unbenanntes Werk";
    const text = document.getElementById('userInput'].value;
    const folder = document.getElementById('folderSelect'].value;

    if (!text.trim()) {
        alert('Bitte gib einen Text ein!');
        return;
    }

    const now = new Date().toISOString();
    const encoder = new TextEncoder();
    const data = encoder.encode(text + now);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

    const newEntry = {
        title: title,
        folder: folder,
        text: text,
        timestamp: now,
        hash: hashHex
    };

    vaultEntries.unshift(newEntry);
    localStorage.setItem('laflo_vault_entries', JSON.stringify(vaultEntries));
    
    renderHistory();

    document.getElementById('entryTitle'].value = '';
    document.getElementById('userInput'].value = '';
    alert('Erfolgreich im Ordner "' + folder + '" gesichert!');
}

function renderHistory() {
    const historyDiv = document.getElementById('vaultHistory');
    if (vaultEntries.length === 0) {
        historyDiv.innerHTML = '<p style="font-size: 0.85rem; color: #777;">Noch keine Einträge gespeichert.</p>';
        return;
    }

    // Gruppiere Einträge nach Ordnern
    let grouped = {};
    vaultEntries.forEach(entry => {
        if (!grouped[entry.folder]) {
            grouped[entry.folder] = [];
        }
        grouped[entry.folder].push(entry);
    });

    let html = '';
    for (const [folderName, entries] of Object.entries(grouped)) {
        html += `
            <div class="folder-group">
                <div class="folder-title">📁 ${escapeHtml(folderName)} (${entries.length})</div>
        `;
        entries.forEach(entry => {
            html += `
                <div class="entry-card">
                    <div class="entry-meta">📌 <strong>${escapeHtml(entry.title)}</strong><br>⏱️ ${entry.timestamp}</div>
                    <div class="entry-hash">SHA-256: ${entry.hash}</div>
                    <div class="entry-text"><strong>Originaltext:</strong><br>${escapeHtml(entry.text)}</div>
                    <button class="btn-copy" onclick="copyToClipboard('${entry.hash}')">Hash kopieren</button>
                    <button class="btn-text-copy" onclick="copyToClipboard(${JSON.stringify(entry.text)})">Originaltext kopieren</button>
                </div>
            `;
        });
        html += `</div>`;
    }
    historyDiv.innerHTML = html;
}

function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => {
        alert('Erfolgreich in die Zwischenablage kopiert!');
    }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
    });
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>

</body>
</html>
