<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaFlo-AI Vault | Cloud-Urheberrechtsnachweis</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header {
      text-align: center;
      padding: 10px 0;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      color: var(--accent);
    }
    p.subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }
    @media (min-width: 600px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background-color: #0b1120;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .file-drop {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: #0b1120;
    }
    button.btn {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    button.btn:hover { opacity: 0.9; }
    .status {
      font-size: 0.9rem;
      text-align: center;
      margin-top: 10px;
      color: var(--accent);
    }
    .records-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }
    .record-item {
      background-color: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .record-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .record-title {
      font-weight: 600;
      color: var(--accent);
    }
    .record-badge {
      font-size: 0.75rem;
      background: var(--border);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .record-hash {
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      word-break: break-all;
      margin-top: 6px;
      background: #060a12;
      padding: 6px;
      border-radius: 4px;
    }
    .badge-cloud {
      background: #065f46;
      color: #34d399;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>LaFlo-AI Vault</h1>
      <p class="subtitle">Cloud-Urheberrechtsnachweis & Hash-Tresor</p>
    </header>

    <!-- Tresor PIN -->
    <div class="card">
      <div style="display:flex; justify-content: space-between; align-items: center;">
        <span class="badge-cloud">● Cloud verbunden (Supabase)</span>
      </div>
      <div class="grid grid-2">
        <div>
          <label for="vaultPin">Persönliche Tresor-PIN (schützt deine Sichtbarkeit)</label>
          <input type="password" id="vaultPin" placeholder="z.B. 1234">
        </div>
        <div style="display: flex; align-items: flex-end;">
          <button class="btn" onclick="loadRecords()" style="background: var(--border); color: var(--text);">Tresor synchronisieren</button>
        </div>
      </div>
    </div>

    <!-- Neuer Eintrag -->
    <div class="card">
      <h2 style="margin-top:0; font-size: 1.2rem;">Neues Werk registrieren</h2>
      <div class="grid">
        <div class="grid grid-2">
          <div>
            <label for="docTitle">Titel / Name des Werks</label>
            <input type="text" id="docTitle" placeholder="z.B. Logo Entwurf v1">
          </div>
          <div>
            <label for="docCategory">Kategorie</label>
            <select id="docCategory">
              <option value="Grafik / Design">Grafik / Design</option>
              <option value="Audio / Musik">Audio / Musik</option>
              <option value="Text / Konzept">Text / Konzept</option>
              <option value="Software / Code">Software / Code</option>
              <option value="Sonstiges">Sonstiges</option>
            </select>
          </div>
        </div>

        <div>
          <label>Datei auswählen (Wird nur lokal gehasht, Datei bleibt privat)</label>
          <div class="file-drop" onclick="document.getElementById('fileInput').click()">
            <span id="fileLabel">Hier tippen zum Auswählen einer Datei</span>
            <input type="file" id="fileInput" style="display: none;" onchange="handleFile(this)">
          </div>
        </div>

        <button class="btn" onclick="registerRecord()">Werk in Cloud sichern</button>
        <div id="statusMsg" class="status"></div>
      </div>
    </div>

    <!-- Vorhandene Nachweise -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="margin: 0; font-size: 1.2rem;">Gesicherte Werke (Cloud)</h2>
        <span id="recordCount" style="font-size: 0.85rem; color: var(--text-muted);">0 Einträge</span>
      </div>
      <div id="recordsList" class="records-list">
        <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Gib deine PIN ein und tippe auf "Tresor synchronisieren".</p>
      </div>
    </div>
  </div>

  <script>
    // Supabase Credentials
    const SUPABASE_URL = 'https://lypdflgzdarglofrtjff.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_NpvnKIr1uzFn7qUrMZZzew_GSrAFHrE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedFileHash = null;
    let selectedFileName = null;

    async function handleFile(input) {
      const file = input.files[0];
      if (!file) return;

      selectedFileName = file.name;
      document.getElementById('fileLabel').innerText = 'Berechne Hash für: ' + file.name + '...';

      const arrayBuffer = await file.arrayBuffer();
      const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      selectedFileHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

      document.getElementById('fileLabel').innerText = 'Ausgewählt: ' + file.name;
    }

    async function registerRecord() {
      const pin = document.getElementById('vaultPin').value.trim();
      const title = document.getElementById('docTitle').value.trim();
      const category = document.getElementById('docCategory').value;
      const status = document.getElementById('statusMsg');

      if (!pin) {
        status.innerText = 'Bitte zuerst eine Tresor-PIN oben eingeben!';
        return;
      }
      if (!title || !selectedFileHash) {
        status.innerText = 'Bitte Titel angeben und Datei auswählen!';
        return;
      }

      status.innerText = 'Speichere in Supabase...';

      const newRecord = {
        id: crypto.randomUUID(),
        user_pin: pin,
        title: title,
        category: category,
        file_name: selectedFileName,
        sha256: selectedFileHash,
        created: new Date().toLocaleString('de-DE')
      };

      const { error } = await supabase.from('records').insert([newRecord]);

      if (error) {
        status.innerText = 'Fehler beim Speichern: ' + error.message;
      } else {
        status.innerText = 'Erfolgreich in der Cloud gesichert!';
        document.getElementById('docTitle').value = '';
        document.getElementById('fileInput').value = '';
        document.getElementById('fileLabel').innerText = 'Hier tippen zum Auswählen einer Datei';
        selectedFileHash = null;
        selectedFileName = null;
        loadRecords();
      }
    }

    async function loadRecords() {
      const pin = document.getElementById('vaultPin').value.trim();
      const list = document.getElementById('recordsList');
      const count = document.getElementById('recordCount');

      if (!pin) {
        list.innerHTML = '<p style="color: #ef4444; font-size: 0.9rem; text-align: center;">Bitte gib deine PIN ein, um deine Daten zu laden.</p>';
        return;
      }

      list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Lade Daten aus der Cloud...</p>';

      const { data, error } = await supabase
        .from('records')
        .select('*')
        .eq('user_pin', pin)
        .order('created', { ascending: false });

      if (error) {
        list.innerHTML = '<p style="color: #ef4444; font-size: 0.9rem; text-align: center;">Fehler beim Laden: ' + error.message + '</p>';
        return;
      }

      count.innerText = (data ? data.length : 0) + ' Einträge';

      if (!data || data.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem; text-align: center;">Keine Einträge für diese PIN gefunden.</p>';
        return;
      }

      list.innerHTML = data.map(item => `
        <div class="record-item">
          <div class="record-header">
            <span class="record-title">${escapeHtml(item.title)}</span>
            <span class="record-badge">${escapeHtml(item.category)}</span>
          </div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">
            Datei: ${escapeHtml(item.file_name)} | Gesichert am: ${item.created}
          </div>
          <div class="record-hash">SHA-256: ${item.sha256}</div>
        </div>
      `).join('');
    }

    function escapeHtml(string) {
      return String(string).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
